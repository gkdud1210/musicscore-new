<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>악보 보기 — J&amp;I worship</title>
  <!-- PWA (홈 화면에 추가) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0a0a0f" />
  <script>try{if(localStorage.getItem('jandi.theme')==='light'){document.documentElement.dataset.theme='light';document.querySelector('meta[name=theme-color]')?.setAttribute('content','#ffffff')}}catch(e){}</script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="J&amp;I worship" />
  <meta name="application-name" content="J&amp;I worship" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3" />
  <link rel="icon" type="image/png" href="icons/favicon.png?v=3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css?v=50" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="viewer-body">

  <header class="viewer-header">
    <a href="index.html" class="viewer-back-btn" title="라이브러리로">←</a>
    <span class="viewer-title" id="viewerTitle">불러오는 중...</span>
    <div class="viewer-header-actions">
      <button class="btn-sm" id="analyzePageBtn">🔄 이 페이지 조 변환</button>
      <button class="btn-sm" id="exportBtn">⬇️ PDF 내보내기</button>
    </div>
  </header>

  <div class="viewer-toolbar">
    <div class="viewer-toolbar-group">
      <button class="viewer-tool-btn active" data-tool="pen" title="펜">✏️</button>
      <button class="viewer-tool-btn" data-tool="highlighter" title="형광펜 (반투명, 글씨 위에 칠해도 보여요)">🖍️</button>
      <button class="viewer-tool-btn" data-tool="eraser" title="지우개 (닿은 선을 통째로 지워요)">🧹</button>
    </div>
    <div class="viewer-toolbar-group" id="colorGroup">
      <!-- 색 버튼은 annotate.js 가 펜/형광펜에 맞게 채워요 -->
      <label class="viewer-color-custom" title="원하는 색 고르기">🎨<input type="color" id="customColor" value="#ff3b30" aria-label="원하는 색 고르기" /></label>
    </div>
    <div class="viewer-toolbar-group viewer-width-group">
      <span class="viewer-width-preview" id="widthPreview" aria-hidden="true"><i></i></span>
      <input type="range" id="widthRange" min="1" max="200" step="1" value="8" aria-label="굵기" title="굵기" />
      <span class="viewer-width-val" id="widthVal"></span>
    </div>
    <div class="viewer-toolbar-group">
      <button class="viewer-tool-btn" id="undoBtn" title="실행취소">↩️</button>
      <button class="viewer-tool-btn" id="redoBtn" title="다시 하기">↪️</button>
      <button class="viewer-tool-btn" id="fingerBtn" title="손가락으로도 쓰기 (끄면 펜슬·마우스로만 써요)">☝️</button>
      <button class="viewer-tool-btn" id="panModeBtn" title="손가락으로 이동/확대 화면 이동">🖐️</button>
    </div>
    <div class="viewer-toolbar-group viewer-toolbar-zoom">
      <button class="viewer-tool-btn" id="zoomOutBtn" title="축소">－</button>
      <button class="viewer-tool-btn" id="zoomInBtn" title="확대">＋</button>
    </div>
  </div>

  <div class="viewer-canvas-scroll" id="canvasScroll">
    <div class="viewer-page-stack" id="pageStack">
      <canvas id="pdfCanvas"></canvas>
      <canvas id="inkCanvas"></canvas>
    </div>
  </div>

  <div class="viewer-page-nav">
    <button class="btn-sm" id="prevPageBtn">◀ 이전</button>
    <span class="viewer-page-indicator" id="pageIndicator">— / —</span>
    <button class="btn-sm" id="nextPageBtn">다음 ▶</button>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/api.js?v=23"></script>
  <script src="js/annotate.js?v=4"></script>
  <script src="js/viewer.js?v=2"></script>
</body>
</html>
